name: Build Analytics Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir buildsrc
          unzip -q *.zip -d buildsrc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: buildsrc
        run: npm install

      - name: Create Android project
        working-directory: buildsrc
        run: npx cap add android

      - name: Sync app
        working-directory: buildsrc
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: buildsrc/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Analytics-Pro-APK
          path: buildsrc/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
